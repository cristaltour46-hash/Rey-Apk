name: Build Rey Shop APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ReyShop-perbaikan-v23.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source package
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract Rey Shop source
        run: |
          unzip -q ReyShop-perbaikan-v23.zip -d source
          echo "Folders found after extraction:"
          find source -maxdepth 5 -type d -name android-wrapper -print
          WRAPPER_DIR="$(find source -type d -name android-wrapper -print -quit)"
          test -n "$WRAPPER_DIR" || { echo 'ERROR: folder android-wrapper tidak ditemukan di ZIP sumber.'; find source -maxdepth 4 -type f | head -80; exit 1; }
          echo "WRAPPER_DIR=$WRAPPER_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon -p "$WRAPPER_DIR" assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          APK_PATH="$(find "$WRAPPER_DIR" -type f -path '*/outputs/apk/debug/*-debug.apk' -print -quit)"
          test -n "$APK_PATH" || { echo 'ERROR: APK tidak ditemukan setelah build.'; find "$WRAPPER_DIR" -type f | tail -80; exit 1; }
          mkdir -p output
          cp "$APK_PATH" output/Rey-Shop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rey-Shop-debug-APK
          path: output/Rey-Shop-debug.apk
          if-no-files-found: error
          retention-days: 7
